[build]
  publish = "dist"
  command = "npm run build"

# 1. Force 301 Redirect from legacy Netlify subdomain to primary domain tektonis.in
[[redirects]]
  from = "https://tektonis.netlify.app/*"
  to = "https://tektonis.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://tektonis.netlify.app/*"
  to = "https://tektonis.in/:splat"
  status = 301
  force = true

# 2. Permanent 301 Redirect from legacy query format /?tool=:slug to clean path /tools/:slug
[[redirects]]
  from = "/"
  to = "/tools/:slug"
  status = 301
  force = true
  query = {tool = ":slug"}

# 3. SPA Client-Side Routing Fallbacks
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
